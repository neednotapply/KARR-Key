# Kept as a manual prerelease workflow. There is intentionally no schedule:
# this repository does not need recurring builds when the source has not changed.
name: Manual Prerelease

on:
  workflow_dispatch:

permissions:
  contents: write
  # Needed to locate and download the Android CI artifact for this commit.
  actions: read

concurrency:
  group: manual-prerelease
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Detect changes since the last release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_sha="$(git rev-parse HEAD)"
          latest_tag="$(
            gh release list \
              --exclude-drafts \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName // ""'
          )"

          changed=true
          previous_sha=""

          if [[ -n "${latest_tag}" ]]; then
            if ! git rev-parse \
              --verify \
              --quiet \
              "refs/tags/${latest_tag}^{commit}" >/dev/null; then
              git fetch --force origin \
                "refs/tags/${latest_tag}:refs/tags/${latest_tag}"
            fi

            previous_sha="$(git rev-list -n 1 "${latest_tag}")"
            # Mirror the Android CI path filter: docs/research-only changes do
            # not alter the APK and should not create another prerelease.
            if git diff --quiet "${previous_sha}" "${current_sha}" -- \
              src/android \
              src/shared \
              src/build.gradle.kts \
              src/settings.gradle.kts \
              src/gradle.properties \
              src/gradle \
              src/gradlew \
              src/gradlew.bat; then
              changed=false
            fi
          fi

          {
            echo "changed=${changed}"
            echo "current_sha=${current_sha}"
            echo "latest_tag=${latest_tag}"
            echo "previous_sha=${previous_sha}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Manual prerelease check"
            echo
            echo "- Current commit: \`${current_sha}\`"
            if [[ -n "${latest_tag}" ]]; then
              echo "- Previous release: \`${latest_tag}\`"
              echo "- Previous commit: \`${previous_sha}\`"
            else
              echo "- Previous release: none"
            fi
            echo "- Build-affecting changes detected: \`${changed}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      # Android CI already built this exact commit when it landed on main.
      # Downloading that APK costs seconds; rebuilding it costs several minutes.
      - name: Reuse the CI build for this commit
        if: steps.changes.outputs.changed == 'true'
        id: reuse
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ steps.changes.outputs.current_sha }}
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p dist
          reused=false
          run_id="$(
            gh run list \
              --workflow=android-ci.yml \
              --commit "${TARGET_SHA}" \
              --status success \
              --limit 1 \
              --json databaseId \
              --jq '.[0].databaseId // ""'
          )"

          if [[ -n "${run_id}" ]] && gh run download "${run_id}" \
            --name "KARR-Key-debug-${TARGET_SHA}" \
            --dir dist; then
            if [[ -f dist/KARR-Key.apk ]]; then
              reused=true
            fi
          fi

          echo "reused=${reused}" >> "${GITHUB_OUTPUT}"
          echo "- Reused Android CI artifact: \`${reused}\`" \
            >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Java
        if: steps.reuse.outputs.reused == 'false'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.reuse.outputs.reused == 'false'
        uses: gradle/actions/setup-gradle@v6

      # Fallback only: reached when CI skipped this commit or its 10-day
      # artifact has aged out.
      - name: Test, lint, and assemble
        if: steps.reuse.outputs.reused == 'false'
        working-directory: src
        run: >-
          ./gradlew --no-daemon
          :shared:core:test :shared:protocol:test
          testDebugUnitTest lintDebug assembleDebug

      - name: Prepare release assets
        if: steps.changes.outputs.changed == 'true'
        id: assets
        env:
          REUSED: ${{ steps.reuse.outputs.reused }}
        shell: bash
        run: |
          set -euo pipefail

          release_date="$(date -u +%Y-%m-%d)"
          short_sha="${GITHUB_SHA::7}"
          tag="prerelease-$(date -u +%Y%m%d)-${short_sha}"
          apk_name="KARR-Key.apk"
          checksum_name="${apk_name}.sha256"
          built_dir="src/android/app/build/outputs/apk/debug"

          mkdir -p dist
          if [[ "${REUSED}" != "true" ]]; then
            cp "${built_dir}/${apk_name}" "dist/${apk_name}"
            cp "${built_dir}/output-metadata.json" dist/output-metadata.json
          fi

          (
            cd dist
            sha256sum "${apk_name}" > "${checksum_name}"
          )

          {
            echo "tag=${tag}"
            echo "title=KARR Key Prerelease ${release_date}"
            echo "apk_path=dist/${apk_name}"
            echo "checksum_path=dist/${checksum_name}"
            echo "metadata_path=dist/output-metadata.json"
          } >> "${GITHUB_OUTPUT}"

      - name: Create prerelease
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.assets.outputs.tag }}
          RELEASE_TITLE: ${{ steps.assets.outputs.title }}
          RELEASE_TARGET: ${{ steps.changes.outputs.current_sha }}
          APK_PATH: ${{ steps.assets.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.assets.outputs.checksum_path }}
          METADATA_PATH: ${{ steps.assets.outputs.metadata_path }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${RELEASE_TAG}" \
            "${APK_PATH}#Debug APK" \
            "${CHECKSUM_PATH}#SHA-256 checksum" \
            "${METADATA_PATH}#Android output metadata" \
            --target "${RELEASE_TARGET}" \
            --title "${RELEASE_TITLE}" \
            --generate-notes \
            --prerelease \
            --latest=false
