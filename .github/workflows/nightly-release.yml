name: Nightly Release

on:
  schedule:
    - cron: "15 2 * * *"
      timezone: America/Los_Angeles

permissions:
  contents: write

concurrency:
  group: nightly-release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: false

      - name: Detect changes since the last release
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          current_sha="$(git rev-parse HEAD)"
          latest_tag="$(
            gh release list \
              --exclude-drafts \
              --limit 1 \
              --json tagName \
              --jq '.[0].tagName // ""'
          )"

          changed=true
          previous_sha=""

          if [[ -n "${latest_tag}" ]]; then
            if ! git rev-parse \
              --verify \
              --quiet \
              "refs/tags/${latest_tag}^{commit}" >/dev/null; then
              git fetch --force origin \
                "refs/tags/${latest_tag}:refs/tags/${latest_tag}"
            fi

            previous_sha="$(git rev-list -n 1 "${latest_tag}")"
            if git diff --quiet "${previous_sha}" "${current_sha}" --; then
              changed=false
            fi
          fi

          {
            echo "changed=${changed}"
            echo "current_sha=${current_sha}"
            echo "latest_tag=${latest_tag}"
            echo "previous_sha=${previous_sha}"
          } >> "${GITHUB_OUTPUT}"

          {
            echo "### Nightly release check"
            echo
            echo "- Current commit: \`${current_sha}\`"
            if [[ -n "${latest_tag}" ]]; then
              echo "- Previous release: \`${latest_tag}\`"
              echo "- Previous commit: \`${previous_sha}\`"
            else
              echo "- Previous release: none"
            fi
            echo "- Repository changes detected: \`${changed}\`"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up Java
        if: steps.changes.outputs.changed == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        if: steps.changes.outputs.changed == 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Test, lint, and assemble
        if: steps.changes.outputs.changed == 'true'
        run: ./gradlew --no-daemon testDebugUnitTest lintDebug assembleDebug

      - name: Prepare release assets
        if: steps.changes.outputs.changed == 'true'
        id: assets
        shell: bash
        run: |
          set -euo pipefail

          release_date="$(date -u +%Y-%m-%d)"
          short_sha="${GITHUB_SHA::7}"
          tag="nightly-$(date -u +%Y%m%d)-${short_sha}"
          apk_name="karr-master-nightly-${release_date}-${short_sha}.apk"
          checksum_name="${apk_name}.sha256"

          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${apk_name}"
          (
            cd dist
            sha256sum "${apk_name}" > "${checksum_name}"
          )

          {
            echo "tag=${tag}"
            echo "title=KARR Master Nightly ${release_date}"
            echo "apk_path=dist/${apk_name}"
            echo "checksum_path=dist/${checksum_name}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create nightly prerelease
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.assets.outputs.tag }}
          RELEASE_TITLE: ${{ steps.assets.outputs.title }}
          RELEASE_TARGET: ${{ steps.changes.outputs.current_sha }}
          APK_PATH: ${{ steps.assets.outputs.apk_path }}
          CHECKSUM_PATH: ${{ steps.assets.outputs.checksum_path }}
        shell: bash
        run: |
          set -euo pipefail

          gh release create "${RELEASE_TAG}" \
            "${APK_PATH}#Nightly debug APK" \
            "${CHECKSUM_PATH}#SHA-256 checksum" \
            "app/build/outputs/apk/debug/output-metadata.json#Android output metadata" \
            --target "${RELEASE_TARGET}" \
            --title "${RELEASE_TITLE}" \
            --generate-notes \
            --prerelease \
            --latest=false
