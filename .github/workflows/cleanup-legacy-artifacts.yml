name: Cleanup legacy Actions artifacts

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-legacy-artifacts.yml"

permissions:
  actions: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Delete active artifacts with legacy long retention
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          threshold_seconds=$((30 * 24 * 60 * 60))
          deleted_count=0
          deleted_bytes=0

          while IFS=$'\t' read -r id name created_at expires_at size_in_bytes; do
            created_epoch="$(date -u -d "${created_at}" +%s)"
            expires_epoch="$(date -u -d "${expires_at}" +%s)"
            retention_seconds=$((expires_epoch - created_epoch))

            if (( retention_seconds > threshold_seconds )); then
              echo "Deleting legacy artifact ${id}: ${name} (${size_in_bytes} bytes; ${created_at} -> ${expires_at})"
              gh api \
                --method DELETE \
                -H "Accept: application/vnd.github+json" \
                "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
              deleted_count=$((deleted_count + 1))
              deleted_bytes=$((deleted_bytes + size_in_bytes))
            fi
          done < <(
            gh api --paginate \
              -H "Accept: application/vnd.github+json" \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" \
              --jq '.artifacts[] | select(.expired == false) | [.id, .name, .created_at, .expires_at, .size_in_bytes] | @tsv'
          )

          {
            echo "### Legacy artifact cleanup"
            echo
            echo "- Deleted artifacts: ${deleted_count}"
            echo "- Deleted bytes: ${deleted_bytes}"
            echo "- Preserved artifacts with retention of 30 days or less."
          } >> "${GITHUB_STEP_SUMMARY}"

          echo "Deleted ${deleted_count} legacy artifacts totaling ${deleted_bytes} bytes."
