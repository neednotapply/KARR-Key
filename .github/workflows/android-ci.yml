name: Android CI

on:
  push:
    branches:
      - main
    # Run only when Android/shared code or Gradle configuration can affect the APK.
    paths:
      - "src/android/**"
      - "src/shared/**"
      - "src/build.gradle.kts"
      - "src/settings.gradle.kts"
      - "src/gradle.properties"
      - "src/gradle/**"
      - "src/gradlew"
      - "src/gradlew.bat"
      - ".github/workflows/android-ci.yml"
  pull_request:
    paths:
      - "src/android/**"
      - "src/shared/**"
      - "src/build.gradle.kts"
      - "src/settings.gradle.kts"
      - "src/gradle.properties"
      - "src/gradle/**"
      - "src/gradlew"
      - "src/gradlew.bat"
      - ".github/workflows/android-ci.yml"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # shared/* are plain Kotlin/JVM modules, so their tests run under `test`
      # rather than the Android-only `testDebugUnitTest`. transport and
      # persistence hold relocated protocol/BLE logic with byte-exact vectors, so
      # they belong in the same gate as core and protocol.
      - name: Test, lint, and assemble
        # The Gradle build root is src/, not the repository root.
        working-directory: src
        run: >-
          ./gradlew --no-daemon
          :shared:core:test :shared:protocol:test
          :shared:transport:test :shared:persistence:test
          testDebugUnitTest lintDebug assembleDebug

      - name: Record APK checksum
        run: |
          sha256sum src/android/app/build/outputs/apk/debug/KARR-Key.apk \
            > src/android/app/build/outputs/apk/debug/KARR-Key.apk.sha256

      - name: Upload debug APK
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v7
        # PRs still build and test, but do not retain a ~15 MB APK. Main-branch
        # pushes keep a short-lived artifact for manual prereleases/reuse.
        continue-on-error: true
        with:
          name: KARR-Key-debug-${{ github.sha }}
          path: |
            src/android/app/build/outputs/apk/debug/KARR-Key.apk
            src/android/app/build/outputs/apk/debug/KARR-Key.apk.sha256
            src/android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 10
          # An APK is already a compressed zip, so recompressing costs time
          # without shrinking it.
          compression-level: 0
