name: Android CI

on:
  push:
    branches:
      - main
    # Documentation, research notes, and editor config cannot change the APK,
    # so they must not spend a full test/lint/assemble cycle.
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          build-root-directory: src

      # shared/* are plain Kotlin/JVM modules, so their tests run under `test`
      # rather than the Android-only `testDebugUnitTest`.
      - name: Test, lint, and assemble
        # The Gradle build root is src/, not the repository root.
        working-directory: src
        run: >-
          ./gradlew --no-daemon
          :shared:core:test :shared:protocol:test
          testDebugUnitTest lintDebug assembleDebug

      - name: Record APK checksum
        run: |
          sha256sum src/android/app/build/outputs/apk/debug/KARR-Key.apk \
            > src/android/app/build/outputs/apk/debug/KARR-Key.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: KARR-Key-debug-${{ github.sha }}
          path: |
            src/android/app/build/outputs/apk/debug/KARR-Key.apk
            src/android/app/build/outputs/apk/debug/KARR-Key.apk.sha256
            src/android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          # 90 days of ~15 MB debug APKs, one per CI run, exhausted the
          # repository's artifact storage quota and blocked all uploads. Two
          # weeks still comfortably outlives the weekly scheduled release that
          # reuses this artifact.
          retention-days: 14
          # An APK is already a compressed zip, so recompressing costs time
          # without shrinking it.
          compression-level: 0
