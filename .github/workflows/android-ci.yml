name: Android CI

on:
  push:
    branches:
      - main
    # Documentation, research notes, and editor config cannot change the APK,
    # so they must not spend a full test/lint/assemble cycle.
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "research/**"
      - "**/*.md"
      - ".editorconfig"
      - ".gitattributes"

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          lfs: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      # shared/* are plain Kotlin/JVM modules, so their tests run under `test`
      # rather than the Android-only `testDebugUnitTest`.
      - name: Test, lint, and assemble
        run: >-
          ./gradlew --no-daemon
          :shared:core:test :shared:protocol:test
          testDebugUnitTest lintDebug assembleDebug

      - name: Record APK checksum
        run: |
          sha256sum android/app/build/outputs/apk/debug/KARR-Key.apk \
            > android/app/build/outputs/apk/debug/KARR-Key.apk.sha256

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: KARR-Key-debug-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/debug/KARR-Key.apk
            android/app/build/outputs/apk/debug/KARR-Key.apk.sha256
            android/app/build/outputs/apk/debug/output-metadata.json
          if-no-files-found: error
          retention-days: 90
          compression-level: 0
