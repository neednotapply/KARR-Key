name: Bug report
description: Report a reproducible KARR Master defect without sensitive data
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Do not attach credentials, vehicle-identifying data, device keys,
        proprietary APKs, or raw authentication captures.
  - type: input
    id: version
    attributes:
      label: App version or commit
      placeholder: 0.1.3 or commit SHA
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Android device and version
      placeholder: Pixel 6a, Android 16
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Expected and actual behavior
      description: Describe both outcomes with secrets and identifiers redacted.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open safe demo
        2. Navigate to Device
        3. Start scan
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Checks already performed
      description: Include test/build results and redacted logs if useful.
